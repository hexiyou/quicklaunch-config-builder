持 {{参数}}、file://、%TEMP%、相对路径",doc:"四、配置说明 → webhook 类型 / 上传本地文件（multipart）"},{key:"timeout",label:"超时 timeout（秒）",kind:"number",section:"webhook",required:!1,default:15,applies:["webhook","download"],desc:"请求超时秒数，程序会把上限截到 120。",format:"数字 > 0，≤ 120 · 缺省 15",doc:"四、配置说明 → webhook 类型 / download 类型"},{key:"jsonPath",label:"结果提取 jsonPath",kind:"text",section:"webhook",required:!1,default:"",applies:["webhook","jsonfile"],desc:"从响应 JSON（或本地 JSON 文件）里取值，如 data.items[0].name；取到就只显示这个值，面板按钮可切回「完整响应」。也支持 $.data.total 这类写法。取不到值时会把原因写在正文里。",format:"字符串 · 如 data.items[0].name / json.from",placeholder:"data.items[0].name",doc:"四、配置说明 → webhook 类型 / jsonfile 类型"},{key:"savePath",label:"保存目录 savePath",kind:"text",section:"download",required:!1,default:"",applies:["download"],desc:'保存目录。支持相对路径（按脚本目录解析）、%USERPROFILE% / %TEMP% 环境变量、UNC 路径；不存在会自动创建（含多级）。"." = 脚本目录。',format:"路径字符串 · 缺省 = 系统「下载」目录；支持 {{变量}} 模板",placeholder:"%USERPROFILE%\\Downloads",doc:"四、配置说明 → download 类型 / 拉取在线配置"},{key:"fileName",label:"保存文件名 fileName",kind:"text",section:"download",required:!1,default:"",applies:["download"],desc:"省略或留空时自动取远端文件名：Content-Disposition 优先，其次 URL 最后一段（curl -O 的行为），非法字符会被换掉。",format:"字符串 · 支持 {{变量}} 模板；留空 = 用远端文件名",placeholder:"config.json 或 报表-{{day}}.xlsx",doc:"四、配置说明 → download 类型"},{key:"onExists",label:"同名处理 onExists",kind:"select",section:"download",required:!1,default:"skip",applies:["download"],options:_i,desc:"同名文件已存在时怎么办。skip 跳过 / overwrite 覆盖；backup 只在 overwrite 时有意义。",format:"skip | overwrite · 缺省 skip",doc:"四、配置说明 → download 类型"},{key:"backup",label:"覆盖前备份 backup",kind:"boolean",section:"download",required:!1,default:!0,applies:["download"],desc:"覆盖前是否把原文件复制成 xxx.bak。指向 config.json 时建议配上 true，万一远端给的是错误页还能恢复。onExists=skip 时无意义。",format:"布尔 · 缺省 true（代码口径：backup !== false）",doc:"四、配置说明 → download 类型 / 拉取在线配置"},{key:"reload",label:"下载后重载配置 reload",kind:"boolean",section:"download",required:!1,default:!1,applies:["download"],desc:"下载成功后自动重载配置（拉取 config.json 时用，不用再点「重载配置」）。",for
