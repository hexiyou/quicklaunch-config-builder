 / 发送前展开的动态值"},{key:"multipart",label:"文件上传 multipart",kind:"multipart",section:"webhook",required:!1,default:null,applies:["webhook"],desc:'上传本地文件（等价 curl -F）。三种写法：完整式 {"fields":{…},"files":[…]}、单文件 {"field":"file","path":"…"}、文件数组 [{"field":…,"path":…}]。有它就整个走 multipart，body 不参与；Content-Type（含 boundary）由程序自己拼，你自己在 headers 里写了就不覆盖。单文件上限 8MB。',format:"对象 或 对象数组 · files[] 每项 field（缺省 file）/ path（必填）/ filename / type；path 支持 {{参数}}、file://、%TEMP%、相对路径",doc:"四、配置说明 → webhook 类型 / 上传本地文件（multipart）"},{key:"timeout",label:"超时 timeout（秒）",kind:"number",section:"webhook",required:!1,default:15,applies:["webhook","download"],desc:"请求超时秒数，程序会把上限截到 120。",format:"数字 > 0，≤ 120 · 缺省 15",doc:"四、配置说明 → webhook 类型 / download 类型"},{key:"jsonPath",label:"结果提取 jsonPath",kind:"text",section:"webhook",required:!1,default:"",applies:["webhook","jsonfile"],desc:"从响应 JSON（或本地 JSON 文件）里取值，如 data.items[0].name；取到就只显示这个值，面板按钮可切回「完整响应」。也支持 $.data.total 这类写法。取不到值时会把原因写在正文里。",format:"字符串 · 如 data.items[0].name / json.from",placeholder:"data.items[0].name",doc:"四、配置说明 → webhook 类型 / jsonfile 类型"},{key:"savePath",label:"保存目录 savePath",kind:"text",section:"download",required:!1,default:"",applies:["download"],desc:"保存目录。支持相对路径（按脚本目录解析）、%USERPROFILE% / %TEMP% 环境变量、UNC 路径；不存在会自动创建（含多级）。缺省 = %USERPROFILE%\\Downloads。",format:"路径字符串 · 缺省 %USERPROFILE%\\Downloads；支持 {{变量}} 模板",placeholder:"%USERPROFILE%\\Downloads",doc:"四、配置说明 → download 类型 / 拉取在线配置"},{key:"fileName",label:"保存文件名 fileName",kind:"text",section:"download",required:!1,default:"",applies:["download"],desc:"省略或留空时自动取远端文件名：Content-Disposition 优先，其次 URL 最后一段（curl -O 的行为），非法字符会被换掉。",format:"字符串 · 支持 {{变量}} 模板；留空 = 用远端文件名",placeholder:"config.json 或 报表-{{day}}.xlsx",doc:"四、配置说明 → download 类型"},{key:"onExists",label:"同名处理 onExists",kind:"select",section:"download",required:!1,default:"skip",applies:["download"],options:$i,desc:"同名文件已存在时怎么办。skip 跳过 / overwrite 覆盖；backup 只在 overwrite 时有意义。",format:"skip | overwrite · 缺省 skip",doc:"四、配置说明 → download 类型"},{key:"backup",label:"覆盖前备份 backup",kind:"boolean",section:"download",required:!1,default:!0,applies:["download"],desc:"覆盖前是否把原文件复制成 xxx.bak。指向 config.json 时建议配上 true，万一远端给的是错误页还能恢复。onExists=skip 时无意义。",format:"布尔 · 缺省 true（代码口径：backup !== false）",doc:"四、配置说明 → download 类型 / 拉取在线配置"},{key:"reload",label:"下载后重载配置 reload",kind:"boolean",section:"download",required:!1,default:!1,applies:["download"],desc:"下载成功后自动重载配置（拉取 config.json 时用，不用再点「重载配置」）。",format:"布尔 · 缺省 false（只认布尔 true）",doc:"四、配置说明 → download 类型 / 拉取在线配置"}],mu=Object.fromEntries(ft.map(e=>[e.key,e])),hu=[{key:"basic",title:"基础信息",note:"所有类型都适用",types:null},{key:"launch",title:"固定参数 / 工作目录",note:"仅 app · cmd · ahk",types:["app","cmd","ahk"]},{key:"params",title:"运行时参数声明",note:"除 url · folder 外都适用",types:["app","cmd","ahk","webhook","download","jsonfile"]},{key:"webhook",title:"HTTP 请求",note:"webhook 专用（部分字段与 download / jsonfile 共用）",types:["webhook","download","jsonfile"]},{key:"download",title:"下载保存",note:"download 专用",types:["download"]}],Wt=[{key:"name",label:"变量名 name",kind:"text",required:!0,default:"",desc:"对应 {{name}} 的变量名，区分大小写。字符类 [\\w.-]（# 开头的动态值不归前端管）。",format:"必填 · [A-Za-z0-9_.-] · 同一条目内唯一",placeholder:"msg"},{key:"label",label:"显示说明 label",kind:"text",required:!1,default:"",desc:"参数面板里显示的中文说明。",format:"字符串",placeholder:"要显示的文字"},{key:"default",label:"默认值 default",kind:"text",required:!1,default:"",desc:"没填时用的值。",format:"字符串",placeholder:"hello"},{key:"placeholder",label:"灰字提示 placeholder",kind:"text",required:!1,default:"",desc:"没填时参数行里的灰字提示。",format:"字符串",placeholder:"拖一个文件进来，或手输路径"},{key:"optional",label:"允许留空 optional",kind:"boolean",required:!1,default:!1,desc:"允许留空；留空时 query 里这个键会被整个去掉（不会拼出 ?lang=）。必填项没填 → 不发请求，预览行变红并说明缺哪个。",format:"布尔 · 缺省 false"},{key:"type",label:"补全类型 type",kind:"select",required:!1,default:"",options:pl,desc:"写 path / dir / file 时，这个参数按 Tab 一定走目录补全（webhook 参数也能用）。不写时按「像路径」的启发式判断。",format:"path | dir | file（可选）"},{key:"required",label:"强制必填 required（兼容字段）",kind:"boolean",required:!1,default:!1,desc:"README 未记载，但 app.js 归一化时使用：optional = (optional === true && required !== true)。写 true 会覆盖 optional。",format:"布尔 · 可选"}],Ss=[{key:"id",label:"分组 ID",kind:"text",required:!0,default:"",desc:"分组标识；搜索框里 @分组 就是点这颗胶囊的等价写法，@n 也能命中 net（前缀匹配）。没有 id 的分组会被直接忽略。",format:"必填 · 全表唯一",placeholder:"sys"},{key:"name",label:"分组名称",kind:"text",required:!1,default:"",desc:"胶囊上显示的文字，省略时用 id。分组只影响过滤，不影响启动；空分组不会显示胶囊。",format:"字符串",placeholder:"系统"}],xs=[{key:"id",label:"任务 ID",kind:"text",required:!1,default:"",desc:"日志里显示的名字；省略就用 run。",format:"字符串",placeholder:"morning-ip"},{key:"run",label:"执行条目 run",kind:"item-select",required:!0,default:"",desc:"要执行的条目：id / 名称 / 关键词都行，语义和 ql run 完全一样（含 >、@ 语法和参数分配）。定时任务触发时把一条 cli 请求塞进命令行队列。",format:"必填 · 引用 items[].id（推荐），也可写名称 / 关键词",placeholder:"http-ip"},{key:"args",label:"本次运行参数 args",kind:"text",required:!1,default:"",desc:'运行时参数，等同 ql run <run> --args "…"。注意它和 items[].args 是「前缀 + 追加」关系，不是覆盖；要跑一条独立命令就单独建一个条目，schedule 里只写 run。',format:"字符串",placeholder:"/k echo 你好"},{key:"at",label:"固定时刻 at",kind:"times",required:!1,default:"",desc:'"HH:MM" 或 "HH:MM:SS"；也可以写成数组，表示一天跑多次。和 every 必须二选一。错过（关机 / 休眠）不补跑。',format:"HH:MM / HH:MM:SS 或它们的数组 · 时 0-23、分秒 0-59；时、分可只写一位（9:30 认）",placeholder:"09:30"},{key:"every",label:"固定间隔 every",kind:"every",required:!1,default:"",desc:'"30s" / "15m" / "2h"（也认 秒 / 分 / 分钟 / 小时），最短 30 秒、最长 30 天，从程序启动那一刻起算。锚点是上一次的计划时刻，不是执行完成的时刻。和 at 必须二选一。',format:"数字 + s|m|h，30 秒 ≤ 间隔 ≤ 2592000 秒（30 天）；也认纯数字（按秒）与 30秒 / 2小时",placeholder:"6h"},{key:"days",label:"星期 days",kind:"days",required:!1,default:"",desc:'只在 at 模式下有效。省略 = 每天；可写 "weekdays"（工作日）/ "weekend"（周末）/ "每天"，也可写数组 ["mon","fri"]（还支持 0-6 数字、中文「周一」「一」）。',format:"字符串 或 字符串数组 · 仅与 at 搭配，和 every 一起写会被判错",placeholder:"weekdays"},{key:"runOnStart",label:"启动就跑一次 runOnStart",kind:"boolean",required:!1,default:!1,desc:"写 true：启动器一启动就先跑一次（延时约 1 秒，给首屏渲染让路），然后照常按 at / every 排程。只在本次进程第一次装载配置时跑，「重载配置」不会再来一遍。跑完会把 every 的下次时刻从「现在」重新算。",format:'布尔 · 只认布尔 true（"true" / 1 都不算）'},{key:"enabled",label:"启用状态 enabled",kind:"boolean",required:!1,default:!0,desc:"写 false 就临时停用（不装、也不报错）。项目自带示例三条都写 false，是故意的。",format:"布尔 · 缺省 true"},{key:"first",label:"歧义取最高分 first",kind:"boolean",required:!1,default:!0,desc:"默认 true：多个条目都能匹配时取最高分那条；写 false 则要求唯一命中，歧义就算失败。",format:"布尔 · 缺省 true"}],vt=[{key:"enabled",label:"启用回调 enabled",kind:"boolean",required:!1,default:!0,desc:'总开关。false = 整块忽略 _ql_callback，连日志都不写。只有布尔 false 才算关（代码 c.enabled !== false）；写成 "false" / 0 / null 一律按启用。',format:"布尔 · 缺省 true",doc:"四、配置说明 → 回调 · 开关与白名单"},{key:"max",label:"单次动作上限 max",kind:"number",required:!1,default:5,desc:"一次响应最多执行几个动作，多的截断并记日志。与 maxDepth 互相独立（一个管单次响应，一个管链深）。",format:"整数 1~20 · 缺省 5；写了数字会被夹进 1~20（写 0 = 夹到 1，不是「禁用」）",doc:"四、配置说明 → 回调 · 开关与白名单"},{key:"maxDepth",label:"回调链深度 maxDepth",kind:"number",required:!1,default:5,desc:"一条回调链最多几跳；配合「祖先链」防环，链深达到上限就阻断，日志写「链深已达上限」。",format:"整数 1~20 · 缺省 5",doc:"四、配置说明 → 回调 · 防环 / 开关与白名单"},{key:"allow",label:"可拉起条目白名单 allow",kind:"tags",required:!1,default:[],desc:"非空时只有列出的条目 id 能被 run 动作拉起（按小写比对）。远端能间接决定「跑哪条命令」，得留个闸；空数组 = 不限制。",format:"字符串数组 · 缺省 []；每项建议引用 items[].id",placeholder:"open-backup-dir, sync-cfg",doc:"四、配置说明 → 回调 · 开关与白名单"},{key:"onQuiet",label:"静默链提示方式 onQuiet",kind:"select",required:!1,default:"notify",options:cu,desc:"「有没有人在看」沿链继承：定时任务触发的链，notify = 托盘提示 + 日志不弹模态框，popup = 照常弹框。手动点出来的链第二跳照常弹。",format:"notify | popup · 缺省 notify（只有写 popup，忽略大小写，才改成 popup）",doc:"四、配置说明 → 回调 · 两个 quiet / 开关与白名单"},{key:"popup",label:"提示框机制 popup",kind:"select",required:!1,default:"native",options:du,desc:'用哪套提示框：native = 系统消息框 + Owner<主窗口>（缺省，模态、系统提示音、Ctrl+C 复制正文、按主窗口居中）；custom = 自绘置顶窗口（非模态、成功绿/失败红、长正文屏上截断）。也认 gui / window 别名；写成别的值一律静默回落 native。注意：动作里的 "type":"popup" 只是 msg 的别名，和这个配置键不相干。',format:"native | custom（也认 gui / window）· 缺省 native；大小写不敏感，未知值回落 native",doc:"四、配置说明 → 回调 · 两套提示框 / 开关与白名单"}];Object.fromEntries(vt.map(e=>[e.key,e]));const Ci=['响应 JSON 的根对象第一层带 _ql_callback 才触发；{"data":{"_ql_callback":…}} 这类深层同名不触发（防撞 + 防误伤）。',"
